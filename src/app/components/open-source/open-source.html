<section class="mb-20">
  <h2 class="mb-2 text-2xl font-semibold text-white md:text-3xl">{{ text().openSourceTitle }}</h2>
  <p class="mb-6 text-slate-400">{{ text().openSourceSubtitle }}</p>
  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (repo of repos(); track repo.name) {
      <article class="rounded-xl border border-white/10 bg-slate-950/70 p-5">
        <h3 class="text-base font-semibold text-slate-100">{{ repo.name }}</h3>
        <p class="mt-2 text-sm text-slate-400">{{ repo.description }}</p>
        <p class="mt-4 text-xs uppercase tracking-[0.12em] text-blue-200">
          {{ repo.stars }} {{ text().stars }}
        </p>
      </article>
    }
  </div>
</section>
