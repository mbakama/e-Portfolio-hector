<section id="experience" class="mb-20">
  <h2 class="mb-8 text-2xl font-semibold text-white md:text-3xl">{{ text().experienceTitle }}</h2>
  <div class="relative border-l border-white/15 pl-6">
    @for (item of experiences(); track item.company) {
      <article class="relative mb-8 rounded-xl border border-white/10 bg-slate-950/70 p-5">
        <span class="absolute -left-[1.95rem] top-6 h-3 w-3 rounded-full bg-blue-400"></span>
        <p class="text-xs uppercase tracking-[0.15em] text-slate-400">{{ item.period }}</p>
        <h3 class="mt-1 text-lg font-semibold text-white">{{ item.role }}</h3>
        <p class="text-sm text-blue-200">{{ item.company }}</p>
        <ul class="mt-3 space-y-1.5">
          @for (highlight of item.highlights; track highlight) {
            <li class="text-sm text-slate-300">- {{ highlight }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
