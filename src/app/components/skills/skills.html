<section id="skills" class="mb-20">
  <h2 class="mb-2 text-2xl font-semibold text-white md:text-3xl">{{ text().stackTitle }}</h2>
  <p class="mb-8 max-w-3xl text-slate-400">{{ text().stackSubtitle }}</p>
  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (group of techGroups(); track group.category) {
      <article
        class="rounded-2xl border border-white/10 bg-slate-950/70 p-5 shadow-lg shadow-black/20 backdrop-blur-sm transition hover:border-blue-300/30"
      >
        <h3 class="text-lg font-semibold text-slate-100">{{ group.category }}</h3>
        <p class="mt-2 text-sm text-slate-400">{{ group.summary }}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          @for (item of group.items; track item) {
            <span
              class="rounded-md border border-blue-400/20 bg-blue-500/10 px-2.5 py-1 text-xs text-blue-200"
              >{{ item }}</span
            >
          }
        </div>
      </article>
    }
  </div>
</section>
